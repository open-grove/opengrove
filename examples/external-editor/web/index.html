<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timeline · 外部产品接入示例</title><link rel="stylesheet" href="/style.css"></head>
<body><header><span class="brand">◈ TIMELINE</span><span>外部产品 + OpenGrove</span><span id="connection" role="status">正在连接…</span></header>
<main><section class="project"><p class="eyebrow">你的产品 · 你的项目</p><h1 id="title">载入项目…</h1><p class="muted">这是一个独立网页。Agent 通过产品提供的操作修改时间线名称，修改前由你确认。</p><div id="clips" class="clips"></div><p id="workspace" class="path"></p><div class="note">当前示例支持项目改名与连续对话，不包含视频裁切或导出。</div><h2>任务历史</h2><div id="history"></div></section>
<section class="assistant"><h2>项目助手</h2><form id="configuration"><label>Agent<select id="kernel"></select></label><label>模型<input id="model" list="models" required><datalist id="models"></datalist></label><label>路由<input id="provider" value="$login" required></label><button type="submit">检查配置</button></form><p id="runtime" class="muted">选择已安装并登录的 Agent。</p>
<div id="messages" class="messages" aria-live="polite"><p class="muted">试试：“把这个项目改名为夏日旅行”。</p></div><div id="interactions"></div><form id="composer"><label for="prompt">告诉助手你想做什么</label><textarea id="prompt" rows="3" placeholder="把项目改名为夏日旅行，并解释你的选择。" required></textarea><div class="actions"><button id="send" type="submit">发送任务</button><button id="observe" type="button" class="secondary" disabled>断开观察</button><button id="cancel" type="button" class="secondary" disabled>取消任务</button></div></form><p id="status" role="status"></p><details><summary>执行进度</summary><pre id="events"></pre></details></section></main><script type="module" src="/app.js"></script></body></html>
