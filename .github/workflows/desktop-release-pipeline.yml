name: Desktop release pipeline
run-name: OpenGrove pipeline ${{ inputs.ref }} / ${{ inputs.stop_after }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact authorized candidate SHA on main
        required: true
        type: string
      stop_after:
        description: Authorized endpoint (finalize stops before registration)
        default: candidate
        required: true
        type: choice
        options: [candidate, finalize, register, promote]
      resume_run_id:
        description: Original pipeline run ID to resume using its existing child runs
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: desktop-release-pipeline-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Continue through the authorized release stages
        env:
          RELEASE_PROGRESS_FILE: ${{ runner.temp }}/release-progress.json
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ inputs.ref }}
          STOP_AFTER: ${{ inputs.stop_after }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: node scripts/release-orchestration.mjs
      - name: Preserve progress even if a stage fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-progress.json
          if-no-files-found: error
          retention-days: 30
