# Build and publish per-kernel agent CI images to GHCR.
#
# Each kernel gets its own image so that pinning or updating one engine never
# entangles another's dependencies. This workflow is manual and single-kernel by
# design: to update one kernel you pick it here and rebuild only its image.
#
# The image already embeds a manifest with the pinned engineVersion (baked by
# the Dockerfile). After push we know the real image digest, so this workflow
# records the mapping in the job summary.
name: Build Agent Images

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: Kernel image to build
        required: true
        type: choice
        options:
          - claude-code
          - codex
          - pi
          - opencode
          - kimi
          - openclaw
          - hermes
      engine_version:
        description: Exact engine version to pin (e.g. 1.18.3)
        required: true
        type: string
      source_revision:
        description: Exact upstream source SHA (required for Hermes)
        required: false
        type: string
      publish:
        description: Publish the verified image to GHCR (false validates only)
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-agent-image-${{ inputs.kernel }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve image reference
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          KERNEL: ${{ inputs.kernel }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$ENGINE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          if [[ "$KERNEL" == hermes ]]; then [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]; fi
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/opengrove-ci-${KERNEL}"
          tag="$ENGINE_VERSION"
          if [[ "$KERNEL" == hermes ]]; then tag="$tag-${SOURCE_REVISION:0:12}"; fi
          echo "ref=${image}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build image for local verification
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/agents/${{ inputs.kernel }}.Dockerfile
          build-args: |
            ENGINE_VERSION=${{ inputs.engine_version }}
            SOURCE_REVISION=${{ inputs.source_revision }}
          tags: ${{ steps.image.outputs.ref }}
          load: true
          push: false
          provenance: false

      - name: Verify pinned engine version before publication
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          KERNEL: ${{ inputs.kernel }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" bash /opt/opengrove/verify-agent-image-version.sh "$KERNEL"

      - name: Record actual engine identity
        id: identity
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          KERNEL: ${{ inputs.kernel }}
        run: |
          command="$KERNEL"
          if [[ "$KERNEL" == claude-code ]]; then command=claude; fi
          version="$(docker run --rm "$IMAGE" "$command" --version | head -n1)"
          test -n "$version"
          echo "cli_version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish verified image
        if: inputs.publish
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker push "$IMAGE"
          echo "reference=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"

      - name: Record image digest in job summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Agent image verified"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| kernel | ${{ inputs.kernel }} |"
            echo "| engineVersion | ${{ inputs.engine_version }} |"
            echo "| image | ${{ steps.image.outputs.ref }} |"
            echo "| local build digest | ${{ steps.build.outputs.digest }} |"
            echo "| published | ${{ inputs.publish }} |"
            echo "| published immutable registry reference | ${{ steps.publish.outputs.reference }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save verified image configuration
        if: success()
        env:
          KERNEL: ${{ inputs.kernel }}
          CLI_VERSION: ${{ steps.identity.outputs.cli_version }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.RUNNER_TEMP + '/agent-image.json', JSON.stringify({schemaVersion:1, kernel:process.env.KERNEL, engineVersion:process.env.ENGINE_VERSION, cliVersion:process.env.CLI_VERSION, sourceRevision:process.env.SOURCE_REVISION || null, image:process.env.REGISTRY_REFERENCE || null}, null, 2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-image-${{ inputs.kernel }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-image.json
          if-no-files-found: error
