name: Real Agent Smoke

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      exploratory:
        description: Test alternate pinned images without producing release certification
        type: boolean
        default: false
      kernel:
        description: Optional single-kernel diagnostic (empty runs all certified kernels)
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: real-agent-smoke-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || (github.event_name == 'merge_group' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' }}

jobs:
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      run: ${{ steps.build.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Resolve the versioned live support plan
        id: build
        env:
          DISPATCH_KERNEL: ${{ inputs.kernel }}
          LIVE_PURPOSE: ${{ inputs.exploratory && 'exploratory' || 'certification' }}
          OPENGROVE_REAL_AGENT_IMAGES: ${{ inputs.exploratory && (vars.OPENGROVE_REAL_AGENT_EXPLORATORY_IMAGES || '{}') || vars.OPENGROVE_REAL_AGENT_IMAGES }}
        run: node scripts/real-agent-ci.mjs plan "$RUNNER_TEMP/real-agent-plan"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-agent-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-agent-plan/plan.json
          if-no-files-found: ignore

  smoke:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04
    environment: opengrove-real-agent-test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container:
      options: --init
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Build server
        run: npm run build:server

      - name: Prepare disposable directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/opengrove-real-runtime/${{ matrix.case }}" \
            "$RUNNER_TEMP/evidence" \
            "$RUNNER_TEMP/auth/${{ matrix.case }}"

      - name: Verify pinned image engine version
        shell: bash
        run: bash scripts/verify-agent-image-version.sh "${{ matrix.kernel }}"

      - name: Select SDK-bundled Claude Engine
        if: matrix.kernel == 'claude-code' && matrix.runtime_mode == 'sdk'
        shell: bash
        run: |
          set -euo pipefail
          sdk_engine="$GITHUB_WORKSPACE/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude"
          sdk_manifest="$GITHUB_WORKSPACE/node_modules/@anthropic-ai/claude-agent-sdk/manifest.json"
          test -x "$sdk_engine"
          test -f "$sdk_manifest"
          expected_version="$(node -e 'process.stdout.write(require(process.argv[1]).version)' "$sdk_manifest")"
          actual_version="$("$sdk_engine" --version 2>&1 | grep -oiE '[0-9]+\.[0-9]+\.[0-9]+([.-][0-9a-z.]+)?' | head -n1)"
          test "$actual_version" = "$expected_version"
          echo "OPENGROVE_CLAUDE_CLI_PATH=$sdk_engine" >> "$GITHUB_ENV"
          echo "SDK-bundled Claude Engine $actual_version selected"

      - name: Probe every required capability and verify current runtime identity
        env:
          CI_CASE_PLAN: ${{ toJSON(matrix) }}
          DEEPSEEK_API_KEY: ${{ matrix.provider.kind == 'deepseek' && secrets.DEEPSEEK_API_KEY || '' }}
          CODEX_AUTH_JSON: ${{ matrix.provider.kind == 'codex-native' && secrets.CODEX_AUTH_JSON || '' }}
        run: node scripts/run-real-agent-ci-case.mjs
      - name: Upload verified sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-agent-case-${{ matrix.case }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-agent-case/sanitized/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    timeout-minutes: 10
    name: Required Real Agent coverage
    if: always()
    needs: [plan, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: real-agent-*
          path: ${{ runner.temp }}/real-agent-coverage
      - name: Require complete fresh coverage for this attempt
        env:
          DISPATCH_KERNEL: ${{ inputs.kernel }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/real-agent-ci.mjs summarize "$RUNNER_TEMP/real-agent-coverage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-agent-coverage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-agent-coverage/real-agent-coverage.json
          if-no-files-found: error
          retention-days: 7
