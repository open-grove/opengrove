name: Main CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opengrove-main-ci
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci-checks.yml
  result:
    name: Main CI result
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require successful checks
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.mjs
