name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: opengrove-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci-checks.yml
  required:
    name: PR required
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require successful checks
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.mjs
