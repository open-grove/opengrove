name: Nightly

on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: opengrove-nightly
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENGROVE_WEB_BUILD_ID: ${{ github.sha }}

jobs:
  network-install:
    name: Online production install / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - name: Install and import the published package shape
        env:
          OPENGROVE_NETWORK_DIAGNOSTICS: ${{ runner.temp }}/network-install.json
        run: node scripts/test-packed-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-install-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-install.json
          if-no-files-found: ignore

  baseline-health:
    name: Golden and previous installer availability
    runs-on: ubuntu-latest
    environment: desktop-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check external release inputs before the next candidate
        env:
          GH_TOKEN: ${{ github.token }}
          OPENGROVE_DESKTOP_RELEASE_PUBLIC_ROOT: ${{ vars.OPENGROVE_DESKTOP_RELEASE_PUBLIC_ROOT }}
        run: node scripts/release-baselines.mjs health "$RUNNER_TEMP/baselines"

  real-agent:
    name: Real Agent matrix
    uses: ./.github/workflows/real-agent-smoke.yml
    secrets: inherit

  result:
    name: Nightly result
    if: always()
    needs:
      - network-install
      - baseline-health
      - real-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require successful dependencies
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.mjs
