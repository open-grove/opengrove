name: Nightly

on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: opengrove-nightly
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENGROVE_WEB_BUILD_ID: ${{ github.sha }}

jobs:
  network-install:
    name: Online production install / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - name: Install and import the published package shape
        env:
          OPENGROVE_NETWORK_DIAGNOSTICS: ${{ runner.temp }}/network-install.json
        run: node scripts/test-packed-runtime.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: network-install-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-install.json
          if-no-files-found: ignore

  baseline-health:
    name: Golden and previous installer availability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check external release inputs before the next candidate
        env:
          GH_TOKEN: ${{ github.token }}
          OPENGROVE_DESKTOP_RELEASE_PUBLIC_ROOT: ${{ vars.OPENGROVE_DESKTOP_RELEASE_PUBLIC_ROOT }}
        run: node scripts/release-baselines.mjs health "$RUNNER_TEMP/baselines"

  real-agent:
    name: Real Agent matrix
    uses: ./.github/workflows/real-agent-smoke.yml
    secrets: inherit

  result:
    name: Nightly result
    if: always()
    needs:
      - network-install
      - baseline-health
      - real-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: real-agent-*
          path: ${{ runner.temp }}/nightly-evidence
      - name: Reissue release evidence from valid case results
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_RESULT: ${{ needs.real-agent.result == 'success' && needs.network-install.result == 'success' && needs.baseline-health.result == 'success' && 'success' || 'failure' }}
        run: node scripts/real-agent-ci.mjs summarize "$RUNNER_TEMP/nightly-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-release-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-evidence/real-agent-coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Require successful dependencies
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.mjs
